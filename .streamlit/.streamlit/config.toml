[theme]
base = "dark"
primaryColor = "#e3b04b"
backgroundColor = "#060a13"
secondaryBackgroundColor = "#10151f"
textColor = "#d8dde3"
font = "sans serif"

[server]
maxUploadSize = 10
enableXsrfProtection = true
enableCORS = true
fileWatcherType = "none"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[runner]
fastReruns = true